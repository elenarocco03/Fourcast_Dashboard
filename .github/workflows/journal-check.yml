name: Journal check

# Every push to main (and every pull request into main) must update report/JOURNAL.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that report/JOURNAL.md was updated
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "First push of the branch: nothing to compare."
            exit 0
          fi
          if git diff --name-only "$base" "$head" | grep -qx "report/JOURNAL.md"; then
            echo "Journal updated."
          else
            echo "::error::report/JOURNAL.md was not updated. Add an entry (see AGENT.md) in a new commit."
            exit 1
          fi
